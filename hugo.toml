baseURL = "https://action4equality.org/"
locale = "en"
title = "Action for Equality Foundation"
disableKinds = ["taxonomy", "term"]
enableRobotsTXT = true

[params]
  description = "Action for Equality Foundation works to promote equality, protection, and opportunity in South Sudan."
  default_social_image = "assets/images/hero-1448x1086.png"
  default_social_image_alt = "Action for Equality Foundation community activity in South Sudan"
  default_social_image_width = 1448
  default_social_image_height = 1086

[permalinks]
  blog = "/blog/:slug/"
  about = "/:slug/"
  activities = "/:slug/"

[outputFormats.AdminManifest]
  mediaType = "application/json"
  baseName = "content"
  path = "admin"
  isPlainText = true
  notAlternative = true

[outputs]
  home = ["HTML", "AdminManifest"]
