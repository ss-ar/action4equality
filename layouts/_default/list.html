{{ define "main" }}
{{ partial "components/page-hero.html" (dict "eyebrow" "Explore" "title" .Title "description" .Description) }}
<section class="py-16 sm:py-24">
  <div class="site-container">
    {{ with .Content }}<div class="prose prose-lg mb-12 max-w-3xl">{{ . }}</div>{{ end }}
    <div class="grid gap-6 md:grid-cols-2 lg:grid-cols-3">
      {{ range .RegularPages.ByTitle }}
      <article class="rounded-3xl border border-primary-100 bg-white p-7 shadow-soft"><h2 class="text-2xl font-extrabold"><a class="hover:text-primary-700" href="{{ .RelPermalink }}">{{ .Title }}</a></h2><p class="mt-4 line-clamp-4 leading-7 text-muted">{{ .Plain | truncate 180 }}</p><a class="mt-6 inline-flex font-heading text-sm font-extrabold text-primary-700" href="{{ .RelPermalink }}">Learn more <span class="ml-2" aria-hidden="true">→</span></a></article>
      {{ end }}
    </div>
  </div>
</section>
{{ end }}
